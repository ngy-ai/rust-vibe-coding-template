[package]
name = "app-cli"
description = "命令行客户端：共享核心的终端入口"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository = "https://github.com/ngy-ai/rust-vibe-coding-template"

# `publish = false` 会把二进制从 cargo-dist 里藏起来，这里显式声明它是可分发目标。
[package.metadata.dist]
dist = true

[dependencies]
anyhow.workspace = true
app-core.workspace = true
clap.workspace = true
ngy-utils-tracing.workspace = true
tracing.workspace = true
