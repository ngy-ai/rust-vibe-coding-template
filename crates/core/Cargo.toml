[package]
name = "app-core"
description = "三端共享的业务逻辑：不依赖 GUI、HTTP 与平台 API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# 只在真正要测量时引入（宪法 V）；与第一个基准一并提交。
criterion = "0.8"
# 指令数基准：给 CI 用的确定性门禁。
iai-callgrind = "0.16"

[[bench]]
name = "execute"
harness = false

[[bench]]
name = "execute_iai"
harness = false
# iai-callgrind 的基准必须由 iai-callgrind-runner 驱动，直接当测试跑会失败；
# 这也让 `cargo test --all-targets` 不会误把它拉进来。
test = false
