[package]
name = "app-core"
description = "三端共享的业务逻辑：不依赖 GUI、HTTP 与平台 API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 不进发布流水线：cargo-dist 默认会把 workspace 里所有成员都构建一遍，
# 库没有可安装的产物，白白延长发布耗时。
[package.metadata.dist]
dist = false

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# 只在真正要测量时引入（宪法 V）；与第一个基准一并提交。
criterion = "0.8"
# 指令数基准：给 CI 用的确定性门禁。
iai-callgrind = "0.16"

[[bench]]
name = "execute"
harness = false

[[bench]]
name = "execute_iai"
harness = false
# cargo test 不带 --all-targets 时不会碰 bench；带上的话会把它当测试跑，
# 而 iai 基准必须由 iai-callgrind-runner 驱动，必然失败。见宪法「合并前检查」。
