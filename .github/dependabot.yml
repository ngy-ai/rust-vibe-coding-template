# 依赖更新：让模板里的依赖不腐化。
#
# 分组策略：patch 与 minor 各自成组，减少 PR 数量；major 不分组，逐个评估——
# 大版本变更需要读迁移说明，混在一起反而看不清是哪一个破坏的。
# Dependabot 只会开 PR，不会自动合并：仍需过分支保护要求的十个检查。

version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo)"
    groups:
      cargo-patch:
        update-types: ["patch"]
      cargo-minor:
        update-types: ["minor"]

  - package-ecosystem: pub
    directory: "/apps/mobile"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(pub)"
    groups:
      pub-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Rust 侧的 `crates/mobile` 把版本钉成 `=2.13.0`，Dart 侧必须同步；
      # 单边升级会让 codegen 漂移检查直接失败，所以这一对交给人工一起改。
      - dependency-name: flutter_rust_bridge

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
