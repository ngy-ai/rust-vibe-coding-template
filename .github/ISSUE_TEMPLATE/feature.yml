name: 功能请求
description: 想增加或改变某项能力，但还没有进入 spec-kit 流程
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本仓库的变更走 spec-kit：issue 只用来讨论**要不要做**，
        一旦决定做，就由 `/speckit.specify` 生成 `specs/<feature>/spec.md`，后续以规格为准。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前受阻的场景，而不是先给出实现方案。
      placeholder: 复制模板后要手改五个 crate 的名字与三处 bundle id，漏一处就编译不过。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 从使用者视角描述结果；可以给方案，但要说明它解决了上面的哪个场景。
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - crates/core
        - crates/cli
        - crates/server
        - crates/mobile 或 apps/mobile
        - crates/desktop
        - CI、工具链与文档
        - 跨多个区域
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 说明为什么不直接用现有能力或依赖自带功能（宪法 VI：没有当前消费者就不写抽象）。
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前自查
      options:
        - label: 已搜索过现有 issue 与 `specs/`，确认不是已有能力
          required: true
        - label: 理解该需求被接受后会先写规格与测试，再写实现
          required: true
