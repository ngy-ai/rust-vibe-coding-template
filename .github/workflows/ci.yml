name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show && rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --check

  lint:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show && rustup component add rustfmt clippy
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Check unused dependencies
        run: cargo machete

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show && rustup component add rustfmt clippy
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-targets --all-features

  desktop:
    name: desktop (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show && rustup component add rustfmt clippy
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      # 桌面端依赖图形栈，Linux runner 需要额外的系统库，因此在 Windows 上单独校验。
      - name: Run clippy for the desktop client
        run: cargo clippy -p app-desktop --all-targets -- -D warnings

  mobile:
    name: mobile (flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: subosito/flutter-action@v2
        with:
          # 与开发机保持一致：codegen 会用 dart format 处理生成物，版本漂移会造成假 diff。
          flutter-version: 3.41.4
          channel: stable
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Resolve Dart dependencies
        run: flutter pub get
      - name: Install flutter_rust_bridge_codegen
        uses: taiki-e/install-action@v2
        with:
          tool: flutter_rust_bridge_codegen@2.13.0
      # Rust 接口的类型检查由 lint job 的 cargo clippy 覆盖，这里只确认绑定没有漂移：
      # 改完 Rust 接口忘了 codegen 时，这一步会红。
      - name: Check generated bindings are up to date
        run: |
          flutter_rust_bridge_codegen generate
          git -C ../.. diff --exit-code --stat -- \
            apps/mobile/lib/src/rust \
            crates/mobile/src/frb_generated.rs
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

  governance:
    name: Constitution governance scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan TODO ownership and forbidden lint suppressions
        shell: bash
        run: |
          set -uo pipefail
          status=0

          # Constitution II：TODO / FIXME 只允许 `TODO(#<issue>): <说明>`，且说明不得为空
          untraceable=$(git grep -nE '\b(TODO|FIXME)\b' -- '*.rs' \
            | grep -vE '\b(TODO|FIXME)\(#[0-9]+\):[[:space:]]*[^[:space:]]' || true)
          if [ -n "$untraceable" ]; then
            echo "::error::TODO/FIXME 必须写成 TODO(#<issue>): <说明>；禁止裸 TODO、TODO(TBD)、TODO(later) 等无归属写法。"
            echo "$untraceable"
            status=1
          fi

          # Constitution II：死代码豁免只接受 #[expect(dead_code, reason = "...见 #<issue>")]
          suppressions=$(git grep -nE '#!?\[allow\(dead_code' -- '*.rs' || true)
          if [ -n "$suppressions" ]; then
            echo "::error::禁止 #[allow(dead_code)]，请改用 #[expect(dead_code, reason = \"<理由>，见 #<issue>\")]。"
            echo "$suppressions"
            status=1
          fi

          exit $status
      - name: Enforce source file size limits
        shell: bash
        run: |
          set -uo pipefail
          status=0
          limit=700
          warn=600

          # 宪法 I：各 crate 的 src/ 与 tests/ 下手写 *.rs 单文件上限 700 行，600 行起预警；
          # 文件头 5 行内标注 @generated 的生成产物不计入。
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if head -n 5 "$file" | grep -q '@generated'; then
              continue
            fi
            lines=$(awk 'END { print NR + 0 }' "$file")
            if [ "$lines" -gt "$limit" ]; then
              echo "::error file=$file::${lines} 行，超过宪法 I 的 ${limit} 行上限"
              status=1
            elif [ "$lines" -ge "$warn" ]; then
              echo "::warning file=$file::${lines} 行，已达宪法 I 的 ${warn} 行预警线，新增代码前先拆"
            fi
          done < <(git ls-files -- \
            'crates/*/src/*.rs' 'crates/*/src/**/*.rs' \
            'crates/*/tests/*.rs' 'crates/*/tests/**/*.rs')

          exit $status

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show && rustup component add rustfmt clippy
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Check known vulnerabilities
        run: cargo audit

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan tracked files for credentials
        shell: bash
        run: |
          set -uo pipefail
          status=0

          report() {
            echo "::error::$1"
            echo "$2"
            status=1
          }

          # 宪法 VIII：本地配置不得入库
          tracked_env=$(git ls-files | grep -E '(^|/)\.env$' || true)
          if [ -n "$tracked_env" ]; then
            report ".env 不得纳入版本控制" "$tracked_env"
          fi

          # 私钥块；正则中的字符类同时避免匹配到本文件自身
          private_key=$(git grep -nIE -- '-----BEGIN [A-Z0-9 ]*PRIV[A]TE KEY-----' || true)
          if [ -n "$private_key" ]; then
            report "检测到私钥块" "$private_key"
          fi

          cloud_key=$(git grep -nIE -- 'AKIA[0-9A-Z]{16}' || true)
          if [ -n "$cloud_key" ]; then
            report "检测到疑似云厂商访问密钥" "$cloud_key"
          fi

          forge_token=$(git grep -nIE -- 'gh[pousr]_[A-Za-z0-9]{20,}' || true)
          if [ -n "$forge_token" ]; then
            report "检测到疑似代码托管平台令牌" "$forge_token"
          fi

          chat_token=$(git grep -nIE -- 'xox[baprs]-[0-9A-Za-z-]{10,}' || true)
          if [ -n "$chat_token" ]; then
            report "检测到疑似协作平台令牌" "$chat_token"
          fi

          exit $status
