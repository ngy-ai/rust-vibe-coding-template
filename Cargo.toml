[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/cli",
    "crates/server",
    "crates/mobile",
    "crates/desktop",
]
# `cargo run` / `cargo test` 默认作用于无图形依赖的四个 crate：桌面端依赖图形栈，
# 在 Linux CI runner 上需要额外系统库，因此由单独的 Windows job 校验。
default-members = ["crates/core", "crates/cli", "crates/server", "crates/mobile"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
# 模板里的 crate 是应用的一部分，不发布到 crates.io。
# 需要发布某个 crate 时，在它自己的 Cargo.toml 里覆盖此项并补许可证字段。
publish = false

[workspace.dependencies]
app-core = { path = "crates/core" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
gpui-kit = "0.8"
http-body-util = "0.1"
ngy-utils-tracing = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
